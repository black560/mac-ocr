name: build-mac

# 在 macOS arm64 runner 上构建自包含 OcrTool.app 并发布 zip 产物
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements.txt pyinstaller "huggingface_hub[cli]"

      # runner 直连 huggingface.co 即可（hf-mirror 仅供国内开发机，走镜像反而
      # 会触发 hub 的元数据校验失败）
      - name: 下载 OCR 模型
        run: |
          ./.venv/bin/hf download PaddlePaddle/PaddleOCR-VL-1.6 \
            --local-dir models/paddleocr-vl

      - name: 安装 ollama 并拉取 LLM
        run: |
          brew install ollama
          mkdir -p models/ollama
          OLLAMA_MODELS="$PWD/models/ollama" ollama serve &
          sleep 5
          OLLAMA_MODELS="$PWD/models/ollama" ollama pull qwen3:4b-instruct-2507-q4_K_M
          kill %1 || true

      - name: 构建 .app
        run: bash build/build_app.sh

      - name: 冒烟测试（headless + mock OCR）
        run: |
          ./.venv/bin/pip install requests || true
          OCR_BACKEND=mock LLM_BASE_URL=http://127.0.0.1:11434/v1 \
            ./.venv/bin/python tests/test_pipeline_mock.py

      # mock 冒烟不碰 transformers，打包漏收模块测不出来（曾在真机表现为
      # ModuleNotFoundError: Could not import module 'AutoProcessor'），
      # 故这里直接运行打包后的 .app 走一次真实 OCR 推理。
      # 强制 CPU：runner 的 MPS 可用内存不足，实测报
      # "MPS backend out of memory (MPS allocated: 0 bytes, ... max allowed: 7.93 GiB)"
      # ——那是 7G 虚拟机的限制，与产物无关；真机 MPS 请在本地跑 --selftest
      - name: 自检（打包产物真实 OCR 推理）
        run: MAC_OCR_FORCE_CPU=1 build/dist/OcrTool.app/Contents/MacOS/OcrTool --selftest

      - uses: actions/upload-artifact@v6
        with:
          name: OcrTool-macos-arm64
          path: build/dist/OcrTool-macos-arm64.zip
          retention-days: 14
